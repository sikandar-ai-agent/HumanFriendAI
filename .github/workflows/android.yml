
name: Build Human Friend AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Extract Human Friend AI project
        run: |
          rm -rf build-project
          mkdir -p build-project

          ZIP_FILE="HumanFriendAI-v0.7-MainActivity-Updated.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found!"
            echo "Available files:"
            ls -lah
            exit 1
          fi

          echo "Extracting $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d build-project

      - name: Locate Android project
        run: |
          echo "Searching for Gradle project..."

          find build-project -name settings.gradle.kts -o -name settings.gradle

          if [ -f build-project/settings.gradle.kts ] || [ -f build-project/settings.gradle ]; then
            echo "PROJECT_DIR=build-project" >> "$GITHUB_ENV"
          else
            PROJECT_DIR=$(find build-project -name settings.gradle.kts -o -name settings.gradle | head -n 1 | xargs dirname)

            if [ -z "$PROJECT_DIR" ]; then
              echo "ERROR: Gradle project not found!"
              exit 1
            fi

            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Verify project files
        run: |
          echo "Project directory: $PROJECT_DIR"
          ls -la "$PROJECT_DIR"
          ls -la "$PROJECT_DIR/app"
          echo "App Gradle configuration:"
          cat "$PROJECT_DIR/app/build.gradle.kts"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HumanFriendAI-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
