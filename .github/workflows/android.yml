name: Build Human Friend AI APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Java
        run: |
          java -version
          echo "JAVA_HOME=$JAVA_HOME"

      - name: Extract Human Friend AI project
        run: |
          rm -rf build-project
          mkdir build-project
          unzip -q HumanFriendAI-OnlineBuild-v0.7-Corrected.zip -d build-project

      - name: Verify project files
        working-directory: build-project
        run: |
          echo "Project files:"
          ls -la
          echo "App files:"
          ls -la app
          echo "Gradle configuration:"
          cat build.gradle.kts
          echo "App Gradle configuration:"
          cat app/build.gradle.kts

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build Debug APK
        working-directory: build-project
        run: |
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HumanFriendAI-debug-apk
          path: build-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
